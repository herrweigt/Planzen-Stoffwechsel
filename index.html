<style>
:root{--g:#2e8b57;--gl:#e6f4ec;--o:#f08a24;--ol:#fff1e0;--b:#2f6fdb;--bl:#e8f0fd;--r:#d64545;--rl:#fde8e8;--y:#f2b705;--t:#22303c;--bg:#f6f8f5;}

.note{background:var(--bl);border-left:6px solid var(--b);padding:10px 14px;border-radius:10px;margin:10px 0}
.heft{background:#fffbe3;border:3px solid var(--y);padding:12px 14px;border-radius:10px;margin:14px 0}

.qt{font-weight:600;margin:0 0 8px}

.opt.ok{background:var(--gl);border-color:var(--g)}
.opt.bad{background:var(--rl);border-color:var(--r)}

.fb{font-weight:600;margin:6px 0}.fb.g{color:var(--g)}.fb.r{color:var(--r)}
details{margin:8px 0}
summary{cursor:pointer;font-weight:600;color:var(--b);min-height:32px}

details.extra summary{color:#6a3fb5}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.btn{background:var(--g);color:#fff;border:none;border-radius:12px;padding:13px 22px;font-size:1rem;min-height:48px}
.btn.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn:disabled{background:#b8c4b8;cursor:not-allowed}
.btn.sec:disabled{background:#fff;color:#b8c4b8;border-color:#b8c4b8}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid #c9d3c9;padding:8px;text-align:left;vertical-align:top}
th{background:#fff4c2}
.amp{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.amp button{flex:1;min-width:150px;border:3px solid #ccc;background:#fff;border-radius:14px;padding:12px;min-height:56px}
.amp button.sel.g{background:#d5f0dd;border-color:var(--g)}
.amp button.sel.y{background:#fff3c4;border-color:var(--y)}
.amp button.sel.r{background:var(--rl);border-color:var(--r)}
textarea{width:100%;min-height:150px;font:inherit;padding:10px;border:2px solid #c5d0c5;border-radius:12px}
.cnt{font-size:.9rem;color:#555}
.gc{border:2px solid #c5d0c5;border-radius:12px;padding:10px 12px;margin:10px 0}
.gc.ok{border-color:var(--g);background:var(--gl)}
.gc.bad{border-color:var(--r);background:var(--rl)}
.gb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gb button{flex:1;min-width:110px;background:#fff;border:2px solid var(--b);color:var(--b);border-radius:10px;padding:8px;min-height:44px}
.score{font-size:2.2rem;font-weight:700;color:var(--g)}
.wrong{background:var(--rl);border-radius:10px;padding:8px 12px;margin:8px 0}
svg text{font-family:inherit}
.card img{max-width:100%;height:auto;display:block;margin:12px auto;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:16px;max-width:620px;max-height:85vh;overflow:auto;padding:18px 20px;width:100%}
dt{font-weight:700;color:var(--g);margin-top:8px}dd{margin:0 0 4px}
@media(max-width:560px){body{font-size:17px}.card{padding:14px}}
</style>

<script>
"use strict";
/* ---------- Daten ---------- */
var GLOSS=[
["Fotosynthese","So stellt eine grüne Pflanze aus Kohlenstoffdioxid und Wasser mit Hilfe von Licht ihren eigenen Zucker her. Dabei entsteht auch Sauerstoff."],
["Chlorophyll","Der grüne Farbstoff in den Blättern. Er fängt das Sonnenlicht ein."],
["Chloroplast","Ein kleiner Baustein in der Pflanzenzelle, in dem die Fotosynthese abläuft."],
["Zucker (Glucose)","Der energiereiche Stoff, den die Pflanze bei der Fotosynthese herstellt. Der Fachbegriff dafür ist Glucose."],
["Stärke","Ein Speicherstoff der Pflanze, der aus vielen Zuckerbausteinen aufgebaut ist, z. B. in der Kartoffel."],
["Spaltöffnung","Eine winzige Öffnung an der Blattunterseite. Dort strömen Gase wie Kohlenstoffdioxid und Sauerstoff ein und aus."],
["Zellatmung","So gewinnt jede Zelle Energie: Zucker wird mit Sauerstoff abgebaut. Dabei entstehen Kohlenstoffdioxid und Wasser."],
["Mitochondrium","Der Baustein in der Zelle, in dem die Zellatmung abläuft. Man nennt ihn das „Kraftwerk der Zelle“."],
["Produzent","Ein Lebewesen, das seinen eigenen Zucker herstellen kann, z. B. eine grüne Pflanze."],
["Konsument","Ein Lebewesen, das seinen Zucker nicht selbst herstellen kann und andere Lebewesen fressen muss, z. B. ein Tier."],
["Kalkwasserprobe","Nachweis für Kohlenstoffdioxid: Klares Kalkwasser wird milchig trüb, wenn Kohlenstoffdioxid hindurchströmt."],
["Glimmspanprobe","Nachweis für Sauerstoff: Ein glimmender Holzspan flammt in reinem Sauerstoff hell auf."],
["Jodprobe (Stärkenachweis)","Nachweis für Stärke: Jodlösung färbt sich an stärkehaltigen Stellen blau-schwarz."],
["Kontrollansatz","Ein zusätzlicher Versuchsansatz, bei dem sich nur eine Sache (z. B. das Licht) vom Hauptansatz unterscheidet. So kann man sicher sein, woran ein Ergebnis wirklich liegt."]
];
var Q={
f1:{sec:"F",t:"Was braucht eine Pflanze für die Fotosynthese?",o:["Kohlenstoffdioxid, Wasser und Licht","Zucker, Sauerstoff und Wärme","Nur Wasser aus dem Boden","Sauerstoff, Wasser und Licht"],c:0,tip:"Schau auf den Anfang des Vorgangs: Was braucht die Pflanze, bevor sie starten kann?"},
f2:{sec:"F",t:"Wo in der Pflanzenzelle läuft die Fotosynthese ab?",o:["Im Chloroplast","Im Mitochondrium","Im Zellkern","In der Zellwand"],c:0,tip:"Denk an den grünen Farbstoff. Wo steckt er drin?"},
f3:{sec:"F",t:"Was entsteht bei der Fotosynthese?",o:["Zucker und Sauerstoff","Kohlenstoffdioxid und Wasser","Zucker und Kohlenstoffdioxid","Sauerstoff und Wasser"],c:0,tip:"Was kommt am Ende heraus, nachdem die Pflanze das Licht genutzt hat?"},
z1:{sec:"Z",t:"Was braucht eine Zelle für die Zellatmung?",o:["Zucker und Sauerstoff","Kohlenstoffdioxid und Wasser","Zucker und Kohlenstoffdioxid","Licht und Wasser"],c:0,tip:"Vergleiche mit der Fotosynthese: Was war dort ein Ergebnis und wird jetzt gebraucht?"},
z2:{sec:"Z",t:"Wo läuft die Zellatmung ab?",o:["Im Mitochondrium","Im Chloroplast","In der Vakuole","In der Spaltöffnung"],c:0,tip:"Wie heißt das „Kraftwerk der Zelle“?"},
z3:{sec:"Z",t:"Wann findet die Zellatmung in einer Pflanze statt?",o:["Bei Tag und bei Nacht","Nur bei Tag","Nur bei Nacht","Nur im Sommer"],c:0,tip:"Pflanzen leben ständig und brauchen deshalb ständig Energie."},
t1:{sec:"F",t:"Welche Aussage zur Fotosynthese stimmt?",o:["Aus Licht entsteht chemische Energie","Aus Zucker entsteht Sauerstoff und Licht","Sie läuft in jeder Zelle ab","Dabei wird Sauerstoff verbraucht"],c:0},
t2:{sec:"F",t:"Wozu dient das Chlorophyll?",o:["Es fängt das Sonnenlicht ein","Es speichert Wasser in der Zelle","Es nimmt Sauerstoff aus der Luft auf","Es baut den Zucker ab"],c:0},
t3:{sec:"F",t:"Woraus stellt die Pflanze ihre Stärke her?",o:["Aus dem gebildeten Zucker","Aus dem Sauerstoff der Luft","Aus dem Kohlenstoffdioxid allein","Aus dem Sonnenlicht direkt"],c:0},
t4:{sec:"F",t:"Wo nimmt das Blatt Kohlenstoffdioxid auf?",o:["Durch die Spaltöffnungen","Durch die Wurzelhaare","Durch die Blütenblätter","Durch die Blattadern"],c:0},
t5:{sec:"Z",t:"Was passiert bei der Zellatmung?",o:["Zucker wird mit Sauerstoff abgebaut","Wasser wird mit Licht verbunden","Zucker wird mit Kohlenstoffdioxid aufgebaut","Sauerstoff wird zu Wasser gemacht"],c:0},
t6:{sec:"Z",t:"Wo läuft die Zellatmung ab?",o:["Im Mitochondrium","Im Chloroplast","Im Zellkern","In der Zellwand"],c:0},
t7:{sec:"Z",t:"Wofür braucht der Körper die Energie aus der Zellatmung?",o:["Für Bewegung, Wachstum und Wärme","Um neuen Zucker herzustellen","Um Sonnenlicht einzufangen","Um Sauerstoff zu speichern"],c:0},
t8:{sec:"Z",t:"Wer betreibt Zellatmung?",o:["Alle Lebewesen, auch Pflanzen","Nur Tiere und Menschen","Nur grüne Pflanzen","Nur Pilze und Bakterien"],c:0},
t9:{sec:"V",t:"Wie hängen Fotosynthese und Zellatmung zusammen?",o:["Fotosynthese liefert den Zucker für die Zellatmung","Beide brauchen unbedingt Sonnenlicht","Beide laufen nur nachts ab","Beide laufen im Chloroplast ab"],c:0},
t10:{sec:"V",t:"Ein Hase frisst Löwenzahn. Woher stammt seine Energie ursprünglich?",o:["Vom Sonnenlicht","Aus dem Wasser der Pflanze","Aus der Luft allein","Aus dem Boden"],c:0},
t11:{sec:"V",t:"Warum ist eine Pflanze unabhängiger als ein Tier?",o:["Sie kann ihren Zucker selbst herstellen","Sie braucht keine Energie","Sie betreibt keine Zellatmung","Sie braucht kein Wasser"],c:0},
tb:{sec:"B",t:"BONUS: Warum geht eine Pflanze im Dauerdunkel ein, obwohl sie Wasser bekommt?",o:["Ohne Licht fehlt ihr der Nachschub an Zucker","Ohne Licht funktioniert die Zellatmung nicht","Sie bekommt zu viel Sauerstoff","Das Wasser verdunstet im Dunkeln nicht"],c:0},
v1:{sec:"X",t:"Warum werden Blätter im Herbst bunt?",o:["Der grüne Farbstoff baut sich ab","Die Blätter nehmen zu viel Sauerstoff auf","Die Zellatmung hört ganz auf","Es entsteht neuer Zucker"],c:0,tip:"Welcher Farbstoff überdeckt im Sommer alle anderen Farben?"},
v2:{sec:"X",t:"Hefe kann Zucker auch ohne Sauerstoff abbauen. Was entsteht dabei?",o:["Alkohol und Kohlenstoffdioxid","Zucker und Sauerstoff","Nur reines Wasser","Stärke und Licht"],c:0,tip:"Denk an Brotteig: Warum geht der Teig auf?"},
v3:{sec:"X",t:"Wasserpest bildet im Sonnenlicht kleine Bläschen. Welches Gas ist das?",o:["Sauerstoff","Kohlenstoffdioxid","Wasserdampf","Stickstoff"],c:0,tip:"Welches Gas entsteht bei der Fotosynthese?"},
v4:{sec:"X",t:"Warum speichern Wälder viel Kohlenstoff?",o:["Sie bauen ihn in Zucker und Holz ein","Sie erzeugen selbst Kohlenstoffdioxid","Sie nehmen nur Sauerstoff auf","Sie brauchen kein Wasser"],c:0,tip:"Woraus besteht Holz, und woher stammt der Baustoff dafür?"},
v5:{sec:"X",t:"Cyanobakterien haben keine Chloroplasten. Können sie trotzdem Fotosynthese betreiben?",o:["Ja, sie haben Chlorophyll in der Zelle","Nein, das ist unmöglich","Nur nachts geht das","Nur mit Mitochondrien"],c:0,tip:"Auch Bakterien ohne Chloroplast können grün sein."},
v6:{sec:"X",t:"Was zeigt eine Nahrungspyramide?",o:["Wie viel Biomasse jede Ebene hat","Wie schnell Tiere wachsen","Wie viel Wasser Pflanzen brauchen","Wie alt Pflanzen werden"],c:0,tip:"Ganz unten stehen die Produzenten mit der größten Menge."},
v7:{sec:"X",t:"Warum stehen die Produzenten ganz unten in der Pyramide?",o:["Sie haben insgesamt die meiste Biomasse","Sie sind die kleinsten Lebewesen","Sie leben am kürzesten","Sie brauchen am wenigsten Energie"],c:0,tip:"Jede Ebene lebt von der darunter, dabei geht Energie verloren."},
v8:{sec:"X",t:"Welches Organ betreibt die Fotosynthese?",o:["Das Blatt","Die Wurzel","Die Sprossachse","Die Blüte"],c:0,tip:"Wo sitzen die Chloroplasten mit dem grünen Farbstoff?"},
v9:{sec:"X",t:"Wozu dient die Wurzel vor allem?",o:["Verankerung und Wasseraufnahme","Herstellung von Zucker","Einfangen von Licht","Abgabe von Sauerstoff"],c:0,tip:"Die Wurzel steckt im Boden, wo es kein Licht gibt."},
n1:{sec:"N",t:"Wie weist man Kohlenstoffdioxid (CO2) nach?",o:["Mit der Kalkwasserprobe – das Kalkwasser wird milchig trüb","Mit der Glimmspanprobe – ein glimmender Span flammt auf","Mit der Jodprobe – es färbt sich blau-schwarz","Mit Lackmuspapier – es färbt sich rot"],c:0,tip:"Klares Kalkwasser reagiert typisch auf dieses Gas."},
n2:{sec:"N",t:"Wie weist man Sauerstoff (O2) nach?",o:["Mit der Glimmspanprobe – ein glimmender Span flammt hell auf","Mit der Kalkwasserprobe – das Wasser wird trüb","Mit der Jodprobe – es färbt sich blau-schwarz","Mit Wasser – es sprudelt sofort"],c:0,tip:"Reiner Sauerstoff lässt eine fast erloschene Glut wieder aufflammen."},
b1:{sec:"B",t:"① Welcher Baustein der Zelle ist hier gemeint?",o:["Chloroplast","Mitochondrium","Zellkern","Spaltöffnung"],c:0,tip:"Hier läuft die Fotosynthese ab, hier sitzt der grüne Farbstoff."},
b2:{sec:"B",t:"② Welcher Baustein der Zelle ist hier gemeint?",o:["Mitochondrium","Chloroplast","Zellwand","Vakuole"],c:0,tip:"Das „Kraftwerk der Zelle“ – hier läuft die Zellatmung ab."},
b3:{sec:"B",t:"③ Was ist hier gemeint?",o:["Spaltöffnung","Blattader","Wurzelhaar","Blütenblatt"],c:0,tip:"Hier strömen Gase in das Blatt hinein und aus dem Blatt heraus."},
b4:{sec:"B",t:"④ Was strömt hier von oben auf das Blatt?",o:["Sonnenlicht","Sauerstoff","Kohlenstoffdioxid","Wasser"],c:0,tip:"Es liefert die Energie für die Fotosynthese."},
b5:{sec:"B",t:"⑤ Welches Gas strömt hier in das Blatt hinein?",o:["Kohlenstoffdioxid","Sauerstoff","Zucker","Stärke"],c:0,tip:"Dieses Gas braucht die Pflanze für die Fotosynthese."},
b6:{sec:"B",t:"⑥ Welches Gas strömt hier aus dem Blatt heraus?",o:["Sauerstoff","Kohlenstoffdioxid","Wasser","Licht"],c:0,tip:"Dieses Gas entsteht bei der Fotosynthese."},
p1:{sec:"P",t:"In welchen Teilen einer Pflanze findet Zellatmung statt?",o:["In allen Teilen – Wurzel, Stängel, Blatt und Blüte","Nur im Blatt","Nur in der Wurzel","Nur nachts im Blatt"],c:0,tip:"Jede lebende Zelle braucht ständig Energie, auch im Dunkeln und in der Wurzel."},
p2:{sec:"P",t:"In welchen Teilen einer Pflanze findet Fotosynthese statt?",o:["Nur in den grünen Teilen, vor allem im Blatt","In allen Teilen gleich stark","Nur in der Wurzel","Nur in der Blüte"],c:0,tip:"Wo sitzt der grüne Farbstoff Chlorophyll?"},
k1:{sec:"K",t:"Eine Schülerin will prüfen: „Pflanzen brauchen Licht für die Fotosynthese.“ Ansatz A steht hell, Ansatz B dunkel, Ansatz C steht hell, bekommt aber kein Wasser. Welche zwei Ansätze muss sie vergleichen?",o:["A und B","A und C","B und C","Nur A"],c:0,tip:"Zwischen den beiden verglichenen Ansätzen darf sich nur EINE Sache unterscheiden: das Licht."},
k2:{sec:"K",t:"Warum ist Ansatz C für diese Frage ungeeignet?",o:["Weil sich dort nicht nur das Licht, sondern auch das Wasser unterscheidet","Weil Ansatz C zu klein ist","Weil Pflanzen kein Wasser brauchen","Weil Ansatz C zu hell steht"],c:0,tip:"Beim Vergleich darf sich jeweils nur ein Faktor unterscheiden."},
k3:{sec:"K",t:"Wozu braucht man überhaupt einen zweiten Ansatz (den Kontrollansatz B) und vergleicht nicht nur Ansatz A allein?",o:["Um sicherzugehen, dass der Unterschied wirklich am Licht liegt und nicht an etwas Zufälligem","Um mehr Pflanzen zu haben","Weil eine Pflanze allein nicht wachsen kann","Um Zeit zu sparen"],c:0,tip:"Ohne Vergleich weißt du nicht, ob das Ergebnis wirklich am untersuchten Faktor liegt."},
d1:{sec:"D",t:"Im Aquarium sinkt die CO2-Menge im Wasser tagsüber. Warum?",o:["Die Fotosynthese verbraucht mehr CO2, als die Zellatmung erzeugt","Die Pflanze macht tagsüber keine Zellatmung","Das Wasser verdunstet tagsüber","Die Fische atmen tagsüber weniger"],c:0,tip:"Am Tag laufen beide Vorgänge, aber einer überwiegt deutlich."},
d2:{sec:"D",t:"Nachts steigt die CO2-Menge im Aquarium wieder an. Warum?",o:["Es läuft nur noch die Zellatmung, die CO2 freisetzt","Die Pflanze stellt nachts mehr Zucker her","Die Fische hören nachts auf zu atmen","Die Pflanze verbraucht nachts mehr Sauerstoff als am Tag"],c:0,tip:"Ohne Licht kann die Pflanze keine Fotosynthese betreiben."},
d3:{sec:"D",t:"Was gilt ungefähr für den Zeitpunkt, an dem die Kurve ihre Richtung ändert (z. B. bei Sonnenauf- oder -untergang)?",o:["Fotosynthese und Zellatmung verbrauchen und erzeugen etwa gleich viel CO2","Die Pflanze stirbt für kurze Zeit ab","Es findet weder Fotosynthese noch Zellatmung statt","Der Sauerstoffgehalt wird unendlich hoch"],c:0,tip:"Genau an diesem Punkt sind beide Vorgänge im Gleichgewicht."},
t12:{sec:"N",t:"Welche Nachweisreaktion zeigt Sauerstoff an?",o:["Die Glimmspanprobe – ein glimmender Span flammt auf","Die Kalkwasserprobe – das Wasser wird trüb","Die Jodprobe – es färbt sich blau-schwarz","Lackmuspapier färbt sich rot"],c:0},
t13:{sec:"N",t:"Was zeigt eine blau-schwarze Färbung nach der Jodprobe an einem Blatt an?",o:["Dass an dieser Stelle Stärke (aus Fotosynthese) vorhanden ist","Dass dort Sauerstoff entstanden ist","Dass dort kein Licht ankam","Dass die Pflanze krank ist"],c:0},
t14:{sec:"B",t:"Welches Zellorganell enthält den grünen Farbstoff und ist der Ort der Fotosynthese?",o:["Der Chloroplast","Das Mitochondrium","Der Zellkern","Die Vakuole"],c:0},
t15:{sec:"P",t:"Wo in der Pflanze findet Zellatmung statt?",o:["In allen Pflanzenteilen, Tag und Nacht","Nur im Blatt bei Tag","Nur in der Wurzel","Nur in der Blüte"],c:0},
t16:{sec:"K",t:"Um die Wirkung von Licht auf die Fotosynthese zu prüfen, braucht man zusätzlich zum belichteten Ansatz auch einen …",o:["… Kontrollansatz im Dunkeln, der sich nur im Licht unterscheidet","… zweiten Topf mit mehr Wasser","… größeren Topf","… Ansatz mit mehr Erde"],c:0}
};

{n:"Einstieg: Der Glocken-Versuch",m:3,g:function(){return true;},h:function(){return '<div class="card"><h2>🕯️ Ein zweites Rätsel aus dem Jahr 1771</h2>'+

{n:"Einstieg",m:2,g:function(){return true;},h:function(){return '<div class="card"><h2>Ein Akku, der sich selbst auflädt</h2>'+
 '<p>Stell dir einen Akku vor, der sich bei Sonnenlicht selbst auflädt. Später kannst du ihn benutzen, zum Beispiel für eine Lampe. Dabei wird der Akku wieder leer.</p>'+
 '<div class="note"><b>Bei Pflanzen ist es ganz ähnlich:</b><br>🌞 <b>Fotosynthese</b> = Aufladen. Aus Licht wird Zucker gemacht.<br>🔋 <b>Zellatmung</b> = Entladen. Aus dem Zucker wird Energie gewonnen.</div>'+
 '<p>Du schaust dir zuerst beide Vorgänge einzeln an. Am Ende setzt du sie zusammen.</p></div>';}},
{n:"Fotosynthese 1",m:3,g:function(){return true;},h:function(){return '<div class="card"><h2>🌿 Fotosynthese: Was passiert?</h2>'+
 '<div class="goal"><b>Lernziel:</b> Du weißt, was eine Pflanze für die Fotosynthese braucht und was dabei entsteht.</div>'+
 '<p>Grüne Pflanzen können ihren eigenen Zucker herstellen. Man nennt sie deshalb <b>Produzenten</b>. Beispiele: Buche, Salat, Gras, Wasserpest.</p>'+
 eqSvg("F")+
 '<p>Die Pflanze nimmt Wasser über die Wurzeln auf. Kohlenstoffdioxid holt sie sich aus der Luft, durch kleine Öffnungen im Blatt, die <b>Spaltöffnungen</b>.</p></div>';}},
{n:"Frage: Fotosynthese 1",m:1,g:function(){return S.ans.f1!==undefined;},h:function(){return '<div class="card"><h2>❓ Verstanden?</h2><p>Beantworte die Frage aus dem Gedächtnis, ohne zurückzublättern.</p>'+quiz("f1")+'</div>';}},
{n:"Fotosynthese 2",m:3,g:function(){return true;},h:function(){return '<div class="card"><h2>🌿 Fotosynthese: Wo und wozu?</h2>'+
 '<p>Die Fotosynthese läuft im <b>Chloroplast</b> ab, einem Baustein der Blattzelle. Darin steckt der grüne Farbstoff <b>Chlorophyll</b>. Er fängt das Licht ein. Deshalb sind Blätter grün.</p>'+
 '<p>Den fertigen Zucker nutzt die Pflanze zum Wachsen. Einen Teil baut sie zu <b>Stärke</b> um und speichert ihn, zum Beispiel in der Kartoffel. Den übrig gebliebenen Sauerstoff gibt sie an die Luft ab.</p>'+
 '<div class="goal o"><b>Wichtig:</b> Der Sauerstoff, den wir atmen, stammt aus der Fotosynthese der Pflanzen.</div>'+
 '<details class="extra"><summary>⭐ Extra-Wissen (freiwillig)</summary>Fotosynthese läuft in zwei Teilschritten ab. Zuerst wird Licht eingefangen und Wasser gespalten, dabei entsteht der Sauerstoff. Danach wird aus Kohlenstoffdioxid der Zucker aufgebaut.</details>'+
 '<details class="extra"><summary>🔬 Teilchenmodell (freiwillig)</summary><p>Man kann sich Stoffe auch als kleine Bausteine (Teilchen) vorstellen. Bei der Fotosynthese werden keine Bausteine erzeugt oder vernichtet, sie werden nur neu zusammengesetzt. Deshalb stecken links und rechts vom Pfeil genau gleich viele Bausteine derselben Art:</p>'+particleSvg("F")+'</details></div>';}},

{n:"Zellatmung 1",m:3,g:function(){return true;},h:function(){return '<div class="card"><h2>🫁 Zellatmung: Was passiert?</h2>'+
 '<div class="goal o"><b>Lernziel:</b> Du weißt, was eine Zelle für die Zellatmung braucht und was dabei entsteht.</div>'+
 '<p>Alle Lebewesen brauchen ständig Energie: zum Bewegen, Wachsen und Warmbleiben. Diese Energie holen sich die Zellen, indem sie Zucker mit Sauerstoff abbauen. Beispiele: deine Muskelzellen beim Laufen, Zellen einer Buche, Zellen der Wasserpest.</p>'+
 eqSvg("Z")+
 '<p>Achtung: Zellatmung ist nicht dasselbe wie das Atmen mit der Lunge. Das Atmen bringt nur den Sauerstoff zu den Zellen. Die Zellatmung selbst passiert erst in der Zelle.</p></div>';}},
{n:"Frage: Zellatmung 1",m:1,g:function(){return S.ans.z1!==undefined;},h:function(){return '<div class="card"><h2>❓ Verstanden?</h2><p>Beantworte die Frage aus dem Gedächtnis, ohne zurückzublättern.</p>'+quiz("z1")+'</div>';}},
{n:"Zellatmung 2",m:3,g:function(){return true;},h:function(){return '<div class="card"><h2>🫁 Zellatmung: Wo und wozu?</h2>'+
 '<p>Die Zellatmung läuft im <b>Mitochondrium</b> ab. Man nennt es auch das „Kraftwerk der Zelle“. Die freigesetzte Energie kann die Zelle sofort nutzen. Ein Teil davon wird als Wärme frei, deshalb wird dir beim Sport warm.</p>'+
 '<div class="goal"><b>Wichtig:</b> Auch Pflanzen betreiben Zellatmung, und zwar Tag und Nacht. Tagsüber überwiegt aber die Fotosynthese, deshalb geben Pflanzen insgesamt Sauerstoff ab.</div>'+
 '<details class="extra"><summary>⭐ Extra-Wissen (freiwillig)</summary>Ohne Sauerstoff können manche Zellen Zucker nur unvollständig abbauen. Hefe bildet dabei Alkohol und Kohlenstoffdioxid, das nennt man Gärung. Dabei entsteht viel weniger Energie als bei der Zellatmung mit Sauerstoff.</details>'+
 '<details class="extra"><summary>🔬 Teilchenmodell (freiwillig)</summary><p>Auch bei der Zellatmung werden die Bausteine nur neu geordnet, genau umgekehrt zur Fotosynthese. Wieder stecken links und rechts vom Pfeil genau gleich viele Bausteine derselben Art:</p>'+particleSvg("Z")+'</details></div>';}},
